name: pr-title

# Pull requests are squash-merged, so the title becomes the commit message on main. This checks it against the Conventional Commits rules in CONTRIBUTING.md.
# pull_request_target is safe here because the job never checks out PR code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The summary "{subject}" must start with a lowercase letter and must not end with a period.
